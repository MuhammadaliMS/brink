[package]
name = "brink"
version = "1.0.10"
description = "Turn your MacBook trackpad edges into volume and brightness controls"
authors = ["Zerowing Studios"]
license = "GPL-3.0-only"
repository = "https://github.com/MuhammadaliMS/brink"
edition = "2021"
rust-version = "1.88"

[lib]
name = "brink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSObject", "NSDictionary", "NSGeometry", "NSValue"] }
objc2-user-notifications = { version = "0.3", features = ["block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger", "UNNotificationSettings"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Build scripts and proc macros run on this Mac during the build: stripping them breaks
# newer macOS toolchains ("can't find crate for ..._proc_macro"). The app itself stays stripped.
[profile.release.build-override]
strip = false
