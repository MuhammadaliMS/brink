<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brink preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: default; user-select: none; }
    /* Where the window will land. Springs between spots as the fingers change direction. */
    #shape {
      position: fixed; box-sizing: border-box; border-radius: 14px;
      background: linear-gradient(160deg, rgba(255, 138, 61, 0.30), rgba(255, 79, 18, 0.24));
      box-shadow: inset 0 0 0 2px rgba(255, 170, 120, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 18px 60px rgba(255, 90, 26, 0.25);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      display: grid; place-items: center;
      opacity: 0; transform: scale(0.97);
      transition: left 0.22s cubic-bezier(0.25, 1.1, 0.4, 1), top 0.22s cubic-bezier(0.25, 1.1, 0.4, 1),
        width 0.22s cubic-bezier(0.25, 1.1, 0.4, 1), height 0.22s cubic-bezier(0.25, 1.1, 0.4, 1),
        opacity 0.14s ease-out, transform 0.2s cubic-bezier(0.25, 1.1, 0.4, 1);
    }
    #shape.on { opacity: 1; transform: none; }
    #shape.minimize { background: rgba(20, 20, 24, 0.28); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.55); transform: scale(0.9); }
    #label {
      font: 600 15px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; letter-spacing: -0.01em;
      color: #fff; padding: 9px 16px; border-radius: 99px;
      background: linear-gradient(160deg, #ff8a3d, #ff4f12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 20px rgba(255, 79, 18, 0.35);
    }
    #shape.minimize #label { background: rgba(28, 28, 32, 0.85); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 6px 20px rgba(0, 0, 0, 0.3); }
    #label:empty { display: none; }
    @media (prefers-reduced-motion: reduce) { #shape { transition: opacity 0.1s; } }
  </style>
</head>
<body>
  <div id="shape"><span id="label"></span></div>
  <script src="preview.js"></script>
</body>
</html>
